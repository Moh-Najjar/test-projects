<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/aseza-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aseza</title>

    <!--
      Blocking (non-module) script so the theme is applied before first paint.
      Lives in public/ so the CSP can stay script-src 'self'.
    -->
    <script src="/theme-init.js"></script>

    <style>
      /* ── Reset ────────────────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* ── Splash container ─────────────────────────────────────────────────── */
      /* Navy field with a teal glow, matching the login hero. */
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #024a78;
        background-image:
          radial-gradient(880px 520px at 50% 118%, rgba(20, 166, 151, 0.42), transparent 62%),
          radial-gradient(620px 420px at 92% -8%, rgba(54, 152, 191, 0.5), transparent 58%),
          radial-gradient(420px 320px at 4% 0%, rgba(255, 255, 255, 0.1), transparent 52%),
          linear-gradient(168deg, #013556 0%, #0367A6 54%, #0a6d86 100%);
        z-index: 9999;
        transition: opacity 0.5s ease-in-out;
      }

      /* Dark surfaces from the theme: page navy, not a brighter brand wash. */
      html[data-theme='dark'] #splash-screen {
        background-color: #0B1623;
        background-image:
          radial-gradient(880px 520px at 50% 118%, rgba(20, 166, 151, 0.2), transparent 62%),
          radial-gradient(620px 420px at 92% -8%, rgba(58, 155, 213, 0.2), transparent 58%),
          linear-gradient(168deg, #071018 0%, #0D2238 58%, #10283f 100%);
      }

      /* ── Language copy ────────────────────────────────────────────────────── */
      /* theme-init.js sets lang before first paint. Default is Arabic. */
      .splash-en,
      .splash-ar { display: none; }
      html[lang='ar'] .splash-ar { display: inline; }
      html:not([lang='ar']) .splash-en { display: inline; }

      /* ── Centred brand mark + title ───────────────────────────────────────── */
      #splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        animation: splashRise 0.55s cubic-bezier(0.0, 0, 0.2, 1) both;
      }

      /* White plate so both halves of the mark (green and blue) stay visible. */
      #splash-logo-mark {
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 32px;
        background: #ffffff;
        box-shadow:
          0 22px 44px rgba(1, 28, 52, 0.32),
          0 0 0 8px rgba(255, 255, 255, 0.1);
      }

      #splash-logo-mark::after {
        content: "";
        position: absolute;
        inset: -12px;
        border-radius: 42px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        animation: splashRing 2.6s ease-out infinite;
      }

      #splash-logo-mark img {
        width: 74px;
        height: 74px;
        object-fit: contain;
      }

      #splash-kicker {
        max-width: 280px;
        font-family: "Segoe UI", "Tahoma", "Cairo", "Inter", sans-serif;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.78);
      }

      html:not([lang='ar']) #splash-kicker {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      #splash-title {
        font-family: "Segoe UI", "Tahoma", "Cairo", "Inter", sans-serif;
        font-size: 30px;
        font-weight: 700;
        line-height: 1.15;
        color: #ffffff;
        letter-spacing: -0.02em;
      }

      html[lang='ar'] #splash-title {
        letter-spacing: 0;
        font-size: 32px;
      }

      /* Same accent rule used on the login hero. */
      #splash-rule {
        width: 48px;
        height: 4px;
        border-radius: 99px;
        background: linear-gradient(90deg, #14A697 0%, rgba(255, 255, 255, 0.85) 100%);
      }

      /* Thin loader along the bottom edge, separate from the accent rule. */
      #splash-bar {
        position: absolute;
        inset-inline: 0;
        bottom: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }

      #splash-bar span {
        display: block;
        width: 28%;
        height: 100%;
        background: linear-gradient(90deg, #14A697, #ffffff);
        animation: splashSweep 1.35s ease-in-out infinite;
      }

      /* ── Keyframes ────────────────────────────────────────────────────────── */
      @keyframes splashRise {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes splashRing {
        0%   { transform: scale(0.96); opacity: 0.65; }
        100% { transform: scale(1.14); opacity: 0; }
      }

      @keyframes splashSweep {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(400%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash-content,
        #splash-logo-mark::after,
        #splash-bar span {
          animation: none;
        }

        #splash-bar span {
          width: 100%;
          opacity: 0.85;
        }
      }

      /* Triggered by main.tsx before the element is removed from the DOM */
      .fade-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Splash is rendered before React mounts and removed by main.tsx -->
    <div id="splash-screen" role="status">
      <div id="splash-content">
        <div id="splash-logo-mark">
          <img src="/src/assets/aseza-icon.svg" alt="" />
        </div>
        <p id="splash-kicker">
          <span class="splash-en">Aqaba Special Economic Zone Authority</span>
          <span class="splash-ar">سلطة منطقة العقبة الاقتصادية الخاصة</span>
        </p>
        <p id="splash-title">
          <span class="splash-en">ASEZA Portal</span>
          <span class="splash-ar">بوابة ASEZA</span>
        </p>
        <div id="splash-rule" aria-hidden="true"></div>
      </div>
      <div id="splash-bar" aria-hidden="true"><span></span></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
